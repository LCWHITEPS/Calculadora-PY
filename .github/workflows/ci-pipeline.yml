
name: CI Pipeline - Calculadora Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Ejecutar pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verificar versión de Python
        run: python --version

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas de unittest
        run: python -m unittest discover -s test -v

      - name: Ejecutar pruebas de descuento con pytest
        run: python -m pytest tests -v

  publicar:
    name: Publicar página en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: pruebas
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
