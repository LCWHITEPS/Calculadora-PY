
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #12121c;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            text-align: center;
            background: #1e1e2d;
            padding: 45px 35px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            border: 1px solid #333348;
            box-shadow: 0 10px 35px #00000040;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #a78bfa;
        }

        p {
            color: #b8b8c9;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            background: #8b5cf6;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }

        .boton:hover {
            background: #7c3aed;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px #8b5cf655;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #77778c;
        }
    </style>
</head>

<body>

    <main class="contenedor">
        <h1>¡Bienvenido!</h1>

        <p>
            Esta es mi página web.
            Un espacio sencillo, moderno y creado con HTML y CSS.
        </p>

        <a href="#inicio" class="boton">Comenzar</a>

        <footer>
            © 2026 Mi Página Web
        </footer>
    </main>

</body>
</html>
